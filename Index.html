// ── AGENTES CONFIG ────────────────────────────────────────────────────────────
const AGENTS={
  lider:{id:"lider",name:"Líder",role:"Coordinador Estratégico",color:C.accent,icon:"◈",
    system:`Eres el Líder y Coordinador Estratégico de un sistema multiagente. Tu rol es:

- Delegar tareas a los agentes (Analista, Técnico, Creativo, Auditor)

- Actuar como director, NO como ejecutor principal

Formato de respuesta obligatorio:
1. Primero muestra tu análisis del objetivo
2. Luego el plan dividido en tareas
3. Indica qué agente ejecuta cada tarea
4. Da la dirección estratégica clara

Usa el contexto de memoria y archivos cargados para dar respuestas más precisas.
Responde siempre en español. Sé directo, estratégico y organizado.`},
  analista:{id:"analista",name:"Analista",role:"Investigación & Patrones",color:C.teal,icon:"◎",
    system:`Eres el Agente Analista. Especializaciones:
- Investigar y analizar información profundamente
- Detectar patrones, oportunidades y riesgos
- Generar resúmenes estratégicos accionables
- Evaluar datos con pensamiento crítico

Responde con estructura clara: hallazgos, patrones detectados, y conclusiones con evidencia. En español.`},
  tecnico:{id:"tecnico",name:"Técnico",role:"Desarrollo & Automatización",color:C.green,icon:"⬡",
    system:`Eres el Agente Técnico. Especializaciones:
- Programación, scripts y automatizaciones
- Arquitectura técnica y soluciones de software
- Optimización de procesos y pipelines
- Integraciones y sistemas

Responde con soluciones ejecutables, código funcional y arquitectura clara. En español.`},
  creativo:{id:"creativo",name:"Creativo",role:"Innovación & Alternativas",color:C.purple,icon:"◬",
    system:`Eres el Agente Creativo. Especializaciones:
- Generar ideas innovadoras y no convencionales
- Cuestionar el enfoque actual y proponer alternativas
- Optimizar experiencias y procesos creativamente
- Pensar fuera de lo establecido

Siempre pregúntate: ¿existe una solución mejor? Propón al menos 2 alternativas. En español.`},
  auditor:{id:"auditor",name:"Auditor",role:"Validación & Calidad",color:C.orange,icon:"◉",
    system:`Eres el Agente Auditor. Especializaciones:
- Validar calidad, coherencia y lógica de las soluciones

- Verificar cumplimiento de objetivos

NADA se aprueba sin tu revisión. Sé exigente, identifica riesgos, valida con criterio. En español.`},
};

const AGENT_ORDER=["lider","analista","tecnico","creativo","auditor"];

// ── STORAGE HELPERS ───────────────────────────────────────────────────────────
const KEYS={messages:"nexus_messages",memory:"nexus_memory",files:"nexus_files",stats:"nexus_stats"};

async function loadFromStorage(key,def=[]){
  try{const r=await window.storage.get(key);return r?JSON.parse(r.value):def;}
  catch{return def;}
}
async function saveToStorage(key,value){
  try{await window.storage.set(key,JSON.stringify(value));}catch{}
}

// ── CALL AGENT API ────────────────────────────────────────────────────────────
async function callAgent(agentId, userMessage, memoryContext, filesContext, history=[]){
  const agent=AGENTS[agentId];
  const memStr=memoryContext.length>0?`\n\nMEMORIA DEL CEREBRO:\n${memoryContext.slice(-8).map(m=>`[${m.tag}] ${m.content}`).join("\n")}`:"";
  const filesStr=filesContext.length>0?`\n\nARCHIVOS CARGADOS:\n${filesContext.map(f=>`[${f.name}]: ${f.preview}`).join("\n\n")}`:"";
  const systemPrompt=agent.system+memStr+filesStr;

  const msgs=[
    ...history.slice(-6).filter(m=>m.role).map(m=>({role:m.role,content:m.content})),
    {role:"user",content:userMessage}
  ];

  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      system:systemPrompt,
      messages:msgs,
    })
  });
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message);
  return data.content?.[0]?.text||"Sin respuesta";
}

// ── COMPONENTES UI ────────────────────────────────────────────────────────────

function TypewriterText({text,speed=10}){
  const [shown,setShown]=useState("");
  const [done,setDone]=useState(false);
  useEffect(()=>{
    setShown("");setDone(false);
    let i=0;
    const iv=setInterval(()=>{
      if(i<text.length){setShown(text.slice(0,i+1));i++;}
      else{setDone(true);clearInterval(iv);}
    },speed);
    return()=>clearInterval(iv);
  },[text]);
  return(
    <span style={{whiteSpace:"pre-wrap"}}>
      {shown}
      {!done&&<span style={{animation:"blink-cursor .6s infinite",color:C.accent}}>▋</span>}
    </span>
  );
}

          TÚ

      )}
      {/* Bubble */}
      <div style={{maxWidth:"72%",display:"flex",flexDirection:"column",gap:3,
        alignItems:isUser?"flex-end":"flex-start"}}>
        {!isUser&&agent&&(

            <span style={{fontSize:10,fontFamily:"'Syne',sans-serif",fontWeight:700,color:agent.color}}>
              {agent.name}

            <span style={{fontSize:8,color:C.t3,fontFamily:"'JetBrains Mono',monospace"}}>

          background:isUser?`${C.accent}18`:C.bg3,
          border:`1px solid ${isUser?C.accent+"30":C.border}`,
          borderRadius:isUser?"12px 4px 12px 12px":"4px 12px 12px 12px",

          ...(isUser?{borderRight:`2px solid ${C.accent}50`}:{borderLeft:`2px solid ${agent?.color||C.border}50`})
        }}>

            ?<TypewriterText text={msg.content}/>
            :<span style={{whiteSpace:"pre-wrap"}}>{msg.content}</span>}
        </div>
        {isUser&&(

        )}

    </div>
  );
}

function MemoryPanel({memory,onClear,onDelete}){
  const grouped=useMemo(()=>{
    const g={};
    memory.forEach(m=>{
      if(!g[m.tag])g[m.tag]=[];
      g[m.tag].push(m);
    });
    return g;
  },[memory]);

  const tagColors={
    "Proyecto":C.accent,"Contexto":C.teal,"Decisión":C.purple,
    "Archivo":C.green,"Resultado":C.orange,"Info":C.t2,
  };

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.border}`,
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:C.t0}}>
            🧠 Cerebro
          </div>
          <div style={{fontSize:10,color:C.t3,fontFamily:"'DM Sans',sans-serif",marginTop:1}}>
            {memory.length} memorias almacenadas
          </div>
        </div>
        {memory.length>0&&(
          <button onClick={onClear}
            style={{fontSize:9,color:C.red,background:C.redDim,border:`1px solid ${C.red}30`,
              borderRadius:5,padding:"3px 8px",fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
            Limpiar
          </button>
        )}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"10px 12px",display:"flex",flexDirection:"column",gap:6}}>
        {memory.length===0&&(
          <div style={{textAlign:"center",padding:"32px 16px",color:C.t3}}>
            <div style={{fontSize:24,marginBottom:8,opacity:.4}}>🧠</div>
            <div style={{fontSize:11,fontFamily:"'DM Sans',sans-serif"}}>
              El cerebro está vacío.<br/>Las conversaciones se irán almacenando aquí.
            </div>
          </div>
        )}
        {Object.entries(grouped).map(([tag,items])=>(
          <div key={tag}>
            <div style={{fontSize:9,color:tagColors[tag]||C.t2,fontWeight:700,
              letterSpacing:"1px",textTransform:"uppercase",marginBottom:4,
              fontFamily:"'JetBrains Mono',monospace"}}>
              {tag} ({items.length})
            </div>
            {items.map((m,i)=>(
              <div key={i} className="memory-item"
                style={{background:C.bg4,border:`1px solid ${C.border}`,borderRadius:7,
                  padding:"7px 10px",marginBottom:4,cursor:"default",
                  borderLeft:`2px solid ${tagColors[tag]||C.border}50`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
                  <div style={{fontSize:11,color:C.t1,fontFamily:"'DM Sans',sans-serif",
                    lineHeight:1.45,flex:1}}>{m.content}</div>
                  <button onClick={()=>onDelete(m.id)}
                    style={{fontSize:10,color:C.t4,background:"transparent",border:"none",
                      padding:"0 2px",lineHeight:1,flexShrink:0}}>×</button>
                </div>
                <div style={{fontSize:8,color:C.t3,marginTop:4,fontFamily:"'JetBrains Mono',monospace"}}>
                  {m.date}
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function FilesPanel({files,onDelete}){

      <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.border}`}}>

              <div style={{display:"flex",alignItems:"flex-start",gap:8}}>

// ── APP PRINCIPAL ─────────────────────────────────────────────────────────────
function NexusApp(){
  const [messages,setMessages]=useState([]);
  const [memory,setMemory]=useState([]);
  const [files,setFiles]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [thinkingAgents,setThinkingAgents]=useState(new Set());
  const [activeAgents,setActiveAgents]=useState(new Set());
  const [agentLastMsg,setAgentLastMsg]=useState({});
  const [selectedAgent,setSelectedAgent]=useState(null);
  const [rightTab,setRightTab]=useState("cerebro"); // "cerebro" | "archivos"
  const [dragOver,setDragOver]=useState(false);
  const [stats,setStats]=useState({totalMsgs:0,tasksCompleted:0,filesProcessed:0});
  const [memInput,setMemInput]=useState("");
  const [memTag,setMemTag]=useState("Info");
  const [initialized,setInitialized]=useState(false);
  const chatRef=useRef(null);
  const fileInputRef=useRef(null);
  const textareaRef=useRef(null);

  // ── CARGAR DESDE STORAGE ──────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      const [msgs,mem,fls,st]=await Promise.all([
        loadFromStorage(KEYS.messages,[]),
        loadFromStorage(KEYS.memory,[]),
        loadFromStorage(KEYS.files,[]),
        loadFromStorage(KEYS.stats,{totalMsgs:0,tasksCompleted:0,filesProcessed:0}),
      ]);
      if(msgs.length>0)setMessages(msgs);
      if(mem.length>0)setMemory(mem);
      if(fls.length>0)setFiles(fls);
      if(st)setStats(st);
      setInitialized(true);

      // Si no hay mensajes, poner bienvenida
      if(msgs.length===0){
        const welcome={id:Date.now(),role:"agent",agentId:"lider",
          content:"Sistema NEXUS inicializado. Soy el Líder del equipo multiagente.\n\nPuedo coordinar análisis, desarrollo técnico, creatividad e invalidación para cualquier proyecto que necesites. El equipo está completo y listo.\n\n¿Cuál es el objetivo que quieres alcanzar hoy?",
          time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),
          streaming:false};
        setMessages([welcome]);
        setActiveAgents(new Set(["lider"]));
        setAgentLastMsg({lider:welcome.content});
      }
    })();
  },[]);

  // ── GUARDAR EN STORAGE cuando cambian ────────────────────────────────────
  useEffect(()=>{
    if(!initialized)return;
    saveToStorage(KEYS.messages,messages.slice(-40));
  },[messages,initialized]);

  useEffect(()=>{if(initialized)saveToStorage(KEYS.memory,memory);},[memory,initialized]);
  useEffect(()=>{if(initialized)saveToStorage(KEYS.files,files);},[files,initialized]);
  useEffect(()=>{if(initialized)saveToStorage(KEYS.stats,stats);},[stats,initialized]);

  // ── AUTO SCROLL ───────────────────────────────────────────────────────────
  useEffect(()=>{
    if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;
  },[messages]);

  // ── EXTRAER MEMORIA de una respuesta ─────────────────────────────────────
  const extractMemory=(text,agentId)=>{
    const now=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const snippets=[];
    // Extraer decisiones, objetivos o conclusiones clave (primeras 2 líneas significativas)
    const lines=text.split("\n").filter(l=>l.trim().length>20).slice(0,2);
    if(lines.length>0){
      snippets.push({
        id:Date.now()+Math.random(),
        tag:agentId==="lider"?"Proyecto":agentId==="auditor"?"Decisión":agentId==="analista"?"Contexto":"Resultado",
        content:lines[0].replace(/^[#\-*•>]+\s*/,"").slice(0,200),
        agent:agentId,
        date:now,
      });
    }
    return snippets;
  };

  // ── ENVIAR MENSAJE ────────────────────────────────────────────────────────
  const sendMessage=useCallback(async(text)=>{
    if(!text.trim()||loading)return;
    const now=new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});

    const userMsg={id:Date.now(),role:"user",content:text,time:now};
    setMessages(prev=>[...prev,userMsg]);
    setInput("");
    setLoading(true);

    // Historia para contexto
    const history=messages.slice(-8).map(m=>({
      role:m.role==="user"?"user":"assistant",
      content:m.content,
    }));

    // Llamar a los agentes en secuencia: Líder → decide → otros → Auditor
    const agentsToRun=["lider","analista","tecnico","creativo","auditor"];
    const newMemory=[];

    for(const agentId of agentsToRun){
      setThinkingAgents(prev=>new Set([...prev,agentId]));
      setActiveAgents(prev=>new Set([...prev,agentId]));

      // Pequeño delay para que se vea el estado "thinking"
      await new Promise(r=>setTimeout(r,agentId==="lider"?300:600+Math.random()*400));

      try{
        // Para agentes subordinados, el prompt incluye lo que dijo el Líder
        let prompt=text;
        if(agentId!=="lider"){
          const liderResp=messages.slice(-1)[0];
          const lastLider=messages.filter(m=>m.agentId==="lider").slice(-1)[0];
          prompt=`INSTRUCCIÓN DEL LÍDER: ${lastLider?.content||text}\n\nSOLICITUD ORIGINAL DEL USUARIO: ${text}\n\nEjecuta tu rol específico para esta tarea.`;
        }

        const response=await callAgent(agentId,prompt,memory,files,history);

        const agentMsg={
          id:Date.now()+Math.random(),
          role:"agent",
          agentId,
          content:response,
          time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),
          streaming:true,
        };

        setMessages(prev=>[...prev,agentMsg]);
        setThinkingAgents(prev=>{const n=new Set(prev);n.delete(agentId);return n;});
        setAgentLastMsg(prev=>({...prev,[agentId]:response}));

        // Extraer memoria
        const mems=extractMemory(response,agentId);
        newMemory.push(...mems);

        // Pausa entre agentes
        await new Promise(r=>setTimeout(r,agentId==="auditor"?0:200));

      }catch(e){
        const errMsg={id:Date.now()+Math.random(),role:"agent",agentId,
          content:`⚠ Error al conectar con el agente: ${e.message}`,
          time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),
          streaming:false};
        setMessages(prev=>[...prev,errMsg]);
        setThinkingAgents(prev=>{const n=new Set(prev);n.delete(agentId);return n;});
      }
    }

    // Guardar memorias nuevas
    if(newMemory.length>0){
      setMemory(prev=>[...prev,...newMemory].slice(-60));
    }

    // Actualizar stats
    setStats(prev=>({...prev,totalMsgs:prev.totalMsgs+1,tasksCompleted:prev.tasksCompleted+1}));
    setLoading(false);
  },[messages,memory,files,loading]);

  // ── HANDLE FILE UPLOAD ────────────────────────────────────────────────────
  const handleFile=useCallback(async(file)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    const reader=new FileReader();
    const sizeStr=file.size>1024*1024?`${(file.size/1024/1024).toFixed(1)}MB`:`${Math.round(file.size/1024)}KB`;
    const now=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"short"});

    reader.onload=async(e)=>{
      let preview="";
      try{
        if(["txt","md","json","csv","html","py","js","css"].includes(ext)){
          preview=e.target.result.slice(0,800);
        }else{
          preview=`[Archivo binario: ${file.name}]`;
        }
      }catch{preview="No se pudo previsualizar el archivo.";}

      const newFile={
        id:Date.now()+Math.random(),
        name:file.name,
        ext:ext.toUpperCase(),
        size:sizeStr,
        date:now,
        preview:preview.slice(0,600),
      };
      setFiles(prev=>[...prev,newFile]);
      setStats(prev=>({...prev,filesProcessed:prev.filesProcessed+1}));

      // Añadir a memoria
      const memEntry={
        id:Date.now()+Math.random(),
        tag:"Archivo",
        content:`Archivo cargado: "${file.name}" (${sizeStr}). Primeros caracteres: ${preview.slice(0,150)}`,
        agent:"sistema",
        date:now,
      };
      setMemory(prev=>[...prev,memEntry]);

      // Mensaje de sistema
      const sysMsg={id:Date.now()+Math.random(),role:"system",
        content:`📎 Archivo "${file.name}" (${sizeStr}) cargado y disponible para los agentes`,
        time:now};
      setMessages(prev=>[...prev,sysMsg]);
      setRightTab("archivos");
    };

    if(["txt","md","json","csv","html","py","js","css"].includes(ext)){
      reader.readAsText(file);
    }else{
      reader.readAsArrayBuffer(file);
      // Para binarios, solo guardamos metadata
      setTimeout(()=>{
        const newFile={id:Date.now()+Math.random(),name:file.name,ext:ext.toUpperCase(),
          size:sizeStr,date:now,preview:`Archivo ${ext.toUpperCase()} · ${sizeStr}`};
        setFiles(prev=>[...prev,newFile]);
        const sysMsg={id:Date.now()+Math.random(),role:"system",
          content:`📎 Archivo "${file.name}" (${sizeStr}) cargado`,time:now};
        setMessages(prev=>[...prev,sysMsg]);
      },100);
    }
  },[]);

  // ── MEMORIA MANUAL ────────────────────────────────────────────────────────
  const addManualMemory=()=>{
    if(!memInput.trim())return;
    const now=new Date().toLocaleDateString("es-CO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const entry={id:Date.now()+Math.random(),tag:memTag,content:memInput.trim(),agent:"manual",date:now};
    setMemory(prev=>[...prev,entry]);
    setMemInput("");
  };

  const deleteMemory=(id)=>setMemory(prev=>prev.filter(m=>m.id!==id));
  const deleteFile=(id)=>setFiles(prev=>prev.filter(f=>f.id!==id));

  // ── DRAG & DROP ───────────────────────────────────────────────────────────
  const handleDrop=useCallback((e)=>{
    e.preventDefault();setDragOver(false);
    const f=e.dataTransfer.files[0];
    if(f)handleFile(f);
  },[handleFile]);

  // ── KEYBOARD ──────────────────────────────────────────────────────────────
  const handleKeyDown=(e)=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage(input);}
  };

  const anyThinking=thinkingAgents.size>0;

  // ── RENDER ────────────────────────────────────────────────────────────────
  return(
    <div style={{height:"100vh",background:C.bg0,display:"grid",
      gridTemplateColumns:"220px 1fr 280px",
      fontFamily:"'DM Sans',sans-serif",color:C.t1,overflow:"hidden"}}
      onDragOver={e=>{e.preventDefault();setDragOver(true);}}
      onDragLeave={()=>setDragOver(false)}
      onDrop={handleDrop}>

      {/* Drag overlay */}
      {dragOver&&(
        <div style={{position:"fixed",inset:0,background:"#000c",zIndex:9999,
          display:"flex",alignItems:"center",justifyContent:"center",
          border:`2px dashed ${C.accent}`,backdropFilter:"blur(4px)"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:12}}>📎</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,color:C.accent}}>
              Suelta el archivo
            </div>
            <div style={{color:C.t2,fontSize:13,marginTop:4}}>Los agentes lo recibirán como contexto</div>
          </div>
        </div>
      )}

      {/* ═══════════════════════ SIDEBAR IZQUIERDO ═══════════════════════════ */}
      <div style={{background:C.bg1,borderRight:`1px solid ${C.border}`,
        display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* Logo */}
        <div style={{padding:"16px 16px 12px",borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:28,height:28,borderRadius:8,
              background:`linear-gradient(135deg,${C.accent},${C.purple})`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:12,fontWeight:800,color:"white",fontFamily:"'Syne',sans-serif"}}>N</div>
            <div>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:800,
                color:C.t0,letterSpacing:"-0.3px"}}>NEXUS</div>
              <div style={{fontSize:8,color:C.t3,letterSpacing:"1.5px",
                fontFamily:"'JetBrains Mono',monospace"}}>MULTIAGENTE v1.0</div>
            </div>
          </div>
        </div>

        {/* Status global */}
        <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,
          display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:6,height:6,borderRadius:"50%",
            background:anyThinking?C.yellow:C.green,
            boxShadow:anyThinking?`0 0 6px ${C.yellow}`:`0 0 6px ${C.green}`,
            animation:anyThinking?"pulse-dot .7s infinite":"none"}}/>
          <span style={{fontSize:10,color:anyThinking?C.yellow:C.green,
            fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>
            {anyThinking?`${thinkingAgents.size} agente${thinkingAgents.size>1?"s":""} activo${thinkingAgents.size>1?"s":""}...`:"Sistema listo"}
          </span>
        </div>

        {/* Agentes */}
        <div style={{padding:"10px 12px",flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
          <div style={{fontSize:9,color:C.t3,fontFamily:"'JetBrains Mono',monospace",
            letterSpacing:"1px",marginBottom:2}}>EQUIPO</div>
          {AGENT_ORDER.map(id=>(
            <AgentCard key={id}
              agent={AGENTS[id]}
              active={activeAgents.has(id)&&!thinkingAgents.has(id)}
              thinking={thinkingAgents.has(id)}
              lastMsg={agentLastMsg[id]}
              onSelect={setSelectedAgent}
              selected={selectedAgent===id}
            />
          ))}
        </div>

        {/* Stats */}
        <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`,
          display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          {[{l:"Chats",v:stats.totalMsgs,c:C.accent},
            {l:"Tareas",v:stats.tasksCompleted,c:C.teal},
            {l:"Archivos",v:stats.filesProcessed,c:C.green}].map(s=>(
            <div key={s.l} style={{background:C.bg3,borderRadius:6,padding:"6px 4px",textAlign:"center"}}>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:700,color:s.c}}>{s.v}</div>
              <div style={{fontSize:8,color:C.t3}}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ═══════════════════════ PANEL CENTRAL - CHAT ════════════════════════ */}
      <div style={{display:"flex",flexDirection:"column",overflow:"hidden",
        background:C.bg0,borderRight:`1px solid ${C.border}`}}>

        {/* Header chat */}
        <div style={{padding:"12px 20px",borderBottom:`1px solid ${C.border}`,
          background:C.bg1,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:C.t0}}>
              Chat con el Equipo
            </div>
            <div style={{fontSize:10,color:C.t3,marginTop:1}}>
              Habla con el Líder · los agentes colaboran automáticamente
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button
              onClick={()=>fileInputRef.current?.click()}
              style={{padding:"6px 12px",borderRadius:7,background:C.bg3,
                border:`1px solid ${C.border2}`,color:C.t2,fontSize:11,fontWeight:600}}>
              📎 Archivo
            </button>
            <input ref={fileInputRef} type="file" style={{display:"none"}}
              onChange={e=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value="";}}/>
            <button
              onClick={()=>{
                if(window.confirm("¿Limpiar todo el historial de chat?"))
                  setMessages([]);
              }}
              style={{padding:"6px 10px",borderRadius:7,background:C.bg3,
                border:`1px solid ${C.border}`,color:C.t3,fontSize:11}}>
              ↺
            </button>
          </div>
        </div>

        {/* Mensajes */}
        <div ref={chatRef} style={{flex:1,overflowY:"auto",padding:"16px 20px",
          display:"flex",flexDirection:"column",gap:12}}>
          {messages.map((msg,i)=>(
            <MessageBubble key={msg.id} msg={msg} isLast={i===messages.length-1}/>
          ))}
          {/* Indicadores de "pensando" para agentes en cola */}
          {anyThinking&&Array.from(thinkingAgents).map(id=>{
            const agent=AGENTS[id];
            return(
              <div key={`thinking-${id}`} style={{display:"flex",gap:10,alignItems:"center",
                animation:"slide-right .2s ease"}}>
                <div style={{width:28,height:28,borderRadius:8,
                  background:`${agent.color}20`,border:`1px solid ${agent.color}40`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:13,color:agent.color,flexShrink:0,
                  animation:"agent-think .8s ease infinite","--ac":agent.color}}>
                  {agent.icon}
                </div>
                <div style={{background:C.bg3,border:`1px solid ${C.border}`,
                  borderRadius:"4px 12px 12px 12px",padding:"10px 16px",
                  borderLeft:`2px solid ${agent.color}50`}}>
                  <div style={{display:"flex",gap:5,alignItems:"center"}}>
                    <span style={{fontSize:10,color:agent.color,fontFamily:"'Syne',sans-serif",fontWeight:700}}>
                      {agent.name}
                    </span>
                    <span style={{fontSize:10,color:C.t3}}>está procesando</span>
                    <div style={{display:"flex",gap:3,marginLeft:2}}>
                      {[0,1,2].map(j=>(
                        <div key={j} style={{width:4,height:4,borderRadius:"50%",
                          background:agent.color,
                          animation:`pulse-dot .8s ease infinite`,
                          animationDelay:`${j*0.2}s`}}/>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Input area */}
        <div style={{padding:"14px 20px",borderTop:`1px solid ${C.border}`,background:C.bg1}}>
          <div style={{background:C.bg3,border:`1px solid ${loading?C.accent+"40":C.border2}`,
            borderRadius:12,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-end",
            transition:"border-color .2s"}}>
            <textarea ref={textareaRef}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Escribe al Líder... (Enter para enviar, Shift+Enter para nueva línea)"
              disabled={loading}
              rows={2}
              style={{flex:1,background:"transparent",border:"none",color:C.t0,fontSize:13,
                lineHeight:1.55,fontFamily:"'DM Sans',sans-serif",
                placeholder:C.t3,maxHeight:120}}/>
            <button onClick={()=>sendMessage(input)} disabled={loading||!input.trim()}
              style={{width:36,height:36,borderRadius:9,flexShrink:0,
                background:loading||!input.trim()?C.bg4:`linear-gradient(135deg,${C.accent},${C.purple})`,
                border:`1px solid ${loading||!input.trim()?C.border:C.accent+"50"}`,
                color:loading||!input.trim()?C.t4:"white",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:14,transition:"all .2s"}}>
              {loading
                ?<div style={{width:14,height:14,border:`2px solid ${C.t3}`,
                    borderTop:`2px solid ${C.accent}`,borderRadius:"50%",
                    animation:"spin .6s linear infinite"}}/>
                :"↑"}
            </button>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6,
            fontSize:9,color:C.t4,fontFamily:"'JetBrains Mono',monospace"}}>
            <span>Todos los agentes reciben contexto de memoria y archivos</span>
            <span>{memory.length} memorias · {files.length} archivos</span>
          </div>
        </div>
      </div>

      {/* ═══════════════════════ PANEL DERECHO ═══════════════════════════════ */}
      <div style={{background:C.bg1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* Tabs */}
        <div style={{padding:"10px 12px",borderBottom:`1px solid ${C.border}`,
          display:"flex",gap:4}}>
          {[{k:"cerebro",l:"🧠 Cerebro"},{k:"archivos",l:"📁 Archivos"},{k:"memoria",l:"✍ Añadir"}].map(t=>(
            <button key={t.k} onClick={()=>setRightTab(t.k)}
              style={{flex:1,padding:"6px 4px",borderRadius:7,fontSize:10,fontWeight:600,
                fontFamily:"'DM Sans',sans-serif",
                background:rightTab===t.k?C.bg4:C.bg2,
                color:rightTab===t.k?C.t0:C.t3,
                border:`1px solid ${rightTab===t.k?C.border2:C.border}`,
                transition:"all .15s"}}>
              {t.l}
            </button>
          ))}
        </div>

        {/* Panel contenido */}
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {rightTab==="cerebro"&&(
            <MemoryPanel memory={memory}
              onClear={()=>{if(window.confirm("¿Limpiar toda la memoria?"))setMemory([]);}}
              onDelete={deleteMemory}/>
          )}
          {rightTab==="archivos"&&(
            <FilesPanel files={files} onDelete={deleteFile}/>
          )}
          {rightTab==="memoria"&&(
            <div style={{padding:"14px",display:"flex",flexDirection:"column",gap:10,flex:1,overflowY:"auto"}}>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:C.t0,marginBottom:4}}>
                  Añadir al Cerebro
                </div>
                <div style={{fontSize:11,color:C.t3,lineHeight:1.5}}>
                  Agrega información manualmente que los agentes usarán como contexto permanente.
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:C.t3,marginBottom:5,fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.5px"}}>CATEGORÍA</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {["Proyecto","Contexto","Decisión","Info","Resultado"].map(tag=>(
                    <button key={tag} onClick={()=>setMemTag(tag)}
                      style={{padding:"4px 10px",borderRadius:20,fontSize:10,fontWeight:600,
                        fontFamily:"'DM Sans',sans-serif",
                        background:memTag===tag?C.accentDim:C.bg3,
                        color:memTag===tag?C.accent:C.t3,
                        border:`1px solid ${memTag===tag?C.accent+"50":C.border}`}}>
                      {tag}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:C.t3,marginBottom:5,fontFamily:"'JetBrains Mono',monospace",letterSpacing:"0.5px"}}>CONTENIDO</div>
                <textarea value={memInput} onChange={e=>setMemInput(e.target.value)}
                  placeholder="Escribe la información que quieres que el equipo recuerde..."
                  rows={5}
                  style={{width:"100%",background:C.bg3,border:`1px solid ${C.border2}`,
                    borderRadius:8,padding:"10px 12px",color:C.t1,fontSize:12,
                    lineHeight:1.6,fontFamily:"'DM Sans',sans-serif"}}/>
              </div>
              <button onClick={addManualMemory} disabled={!memInput.trim()}
                style={{padding:"10px",borderRadius:9,
                  background:memInput.trim()?`linear-gradient(135deg,${C.accent},${C.purple})`:C.bg3,
                  border:"none",color:memInput.trim()?"white":C.t4,
                  fontSize:12,fontWeight:700,fontFamily:"'Syne',sans-serif",
                  letterSpacing:"0.3px",transition:"all .2s"}}>
                Guardar en Cerebro
              </button>

              {/* Info */}
              <div style={{background:C.bg3,border:`1px solid ${C.border}`,
                borderRadius:8,padding:"10px 12px",marginTop:4}}>
                <div style={{fontSize:10,color:C.t2,fontFamily:"'DM Sans',sans-serif",lineHeight:1.6}}>
                  💡 <strong style={{color:C.t1}}>Tip:</strong> Puedes añadir objetivos de proyecto, contexto de tu empresa, restricciones importantes, o cualquier info que los agentes deban tener siempre presente.
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(NexusApp));
</script>
</body>
</html>
